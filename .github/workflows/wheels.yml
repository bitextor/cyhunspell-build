name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        #os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]
        os: [ubuntu-24.04]


    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.1

      - name: Build hunspell
        env:
          CYHUNSPELL_FORCE_BUILD: 1
        run: |
          sudo apt install -y autoconf automake autopoint libtool
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-test.txt
          python setup.py build
          rm -rf build
          rm -rf external/build

      - name: Build wheels
        env:
          CIBW_ENVIRONMENT: CYHUNSPELL_FORCE_BUILD=1
        run: |
          rm hunspell/*.so || true
          python -m cibuildwheel --output-dir wheelhouse
          ls wheelhouse
          for i in wheelhouse/*.whl; do echo "Listing file inside $i"; python -m zipfile -l $i; done

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
